       ── 它在设计稿里是「左箭头」原路径经 rotation −90° + 水平/垂直双翻转得来的 ──
          两道变换抵消后等于**沿垂直中轴镜像一次**（x → 7.5825 − x），故直接写镜像结果：
            (7.5825,16)→(0,16)  (0.2925,8.71)→(7.29,8.71)  (0.2925,7.29)→(7.29,7.29)  (7.5825,0)→(0,0)
            控制点 (−0.0975, 8.32/7.68) → (7.68, 8.32/7.68)
       ── 与「左箭头」完全同规格：臂 45°/开合 90°、平头线帽、路径处处 G1 连续无折角。
          同样不能写 stroke-linecap="round" / stroke-linejoin="round"。
       ── 墨迹外框：尖端在右侧，描边顶到 x = 7.5825 + 0.75 = 8.3325；两个平头端在 x = 0 一侧，
          端帽角点顶到 x = −0.5303、y = ±0.5303 → x 从 −0.5303 到 8.3325（宽 8.8628，与左箭头同宽）、
          y 从 −0.5303 到 16.5303（高 17.0606）。中心线规格仍是 7.5825×16，1:1 未缩放。 -->
