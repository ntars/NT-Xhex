<svg xmlns="http://www.w3.org/2000/svg" width="8.8628" height="17.0606" viewBox="-0.75 -0.5303 8.8628 17.0606">
  <!-- 后退「‹」= 设计稿「左箭头」组内路径，描边 1.5pt。viewBox = **墨迹外框**（含描边溢出）。
       ── 中心线几何逐点取自 sketch 原始锚点（sketch 的 frame 是**中心线外框**，描边溢出在外）──
            (7.5825, 16) ─直线→ (0.2925, 8.71) ─三次贝塞尔→ (0.2925, 7.29) ─直线→ (7.5825, 0)
            控制点 (−0.0975, 8.32) 与 (−0.0975, 7.68)；弧的最左点恰为 x = 0，
            所以中心线外框正好是 7.5825 × 16，与设计稿 frame 完全吻合。
       ── 三条必须守住的规格（实测复核：臂 45.0000°，开合 90.0000°）──
            1) 开合角 45°/臂（合计 90°）。写成 6.0825/7.25 那种是 50°/100°，角度就错了。
            2) 线帽 = **平头**（设计稿 borderOptions.lineCapStyle = 0）→ 不能写 stroke-linecap="round"。
            3) 整条路径处处 G1 连续（无折角），所以不需要任何 linejoin ——
               尖端那个圆角是**用几何画出来的**，不是靠 stroke-linejoin 磨的。
       ── viewBox 为什么不是 "0 0 7.5825 16" ──
          SVG 当背景图/图片用时，**视口外的东西一律被裁掉**（最外层 svg 的 overflow 默认 hidden，
          且不可靠地可改）。平头端帽会把墨迹顶到 x = 8.1128 / y = ±0.5303，尖端描边顶到 x = −0.75，
          于是取墨迹外框：x 从 −0.75 到 8.1128（宽 8.8628）、y 从 −0.5303 到 16.5303（高 17.0606）。
          中心线规格仍是 7.5825×16，缩放比 1:1，没有被压小。 -->
  <path d="M7.5825 16 L0.2925 8.71 C-0.0975 8.32 -0.0975 7.68 0.2925 7.29 L7.5825 0"
        fill="none" stroke="#000000" stroke-width="1.5"/>
</svg>
