<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="算法演乾坤，一问知天命，以数据重现千年术数。无后端、无网络。© 星玖工作室 Ntarstudio" />
  <title>玄玖灵犀 NT-Xhex</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="../../static/icons/icon-192-squircle.png" />
  <link rel="icon" type="image/svg+xml" href="../../static/icons/icon-squircle.svg" />
  <link rel="apple-touch-icon" href="../../static/icons/icon-192-squircle.png" />
  <!-- 视觉规范单一真源（与 uni-app / 微信小程序同一份） -->
  <link rel="stylesheet" href="../../modules/UIModule/theme.css" />
  <style>
    /* ========================================================================
     * 本文件只写「PWA 壳的结构与滚动」；色阶 / 圆角 / 描边 / 字号 / 间距 / 图标 /
     * 动效全部走 theme.css 的 --nt-* 变量与 .nt-* 类，与小程序、uni-app 完全一致。
     *
     * 结构（与小程序 dist/mp-weixin/pages/index/index.wxml 一一对应）：
     *   .view = 一整页（首页 / 结果页 / 关于页 / 关于我们页 / 内容详情页）
     *      └ .home | .res | .ab | .dl  = 页面纵向布局容器（flex 列，占满 .view）
     *           ├ .nt-nav      固定顶栏（安全区避让走 theme.css 的 env()）
     *           ├ .nt-page-h   页名（仅结果页 / 内容详情页有；高 44，上距 24）
     *           ├ .nt-pgbody   滚动正文区（flex:1，左右 24、底 24）
     *           ├ .nt-dual     双按钮条（仅结果页有：导出图片 / 再问一个）
     *           └ .nt-foot     页脚两行（12pt 黑 30%）
     *
     * 尺寸不再写任何魔数：设计稿画布 402×874pt 由「导航 50 + 页名 44 + 正文 flex:1
     * + 按钮条 72 + 页脚 40(+手势条)」自然分掉剩余空间，卡高 600/528 是算出来的结果。
     * ===================================================================== */

    /* ---- 机身边界带：theme.css 给了设计稿值（顶 59 / 底 34）；浏览器端升为「设计带 与 设备安全区取大者」，
            真机上不被刘海/手势条遮挡，无安全区的设备上仍保留设计稿留白。画布总高不变，只是占位不绘制。 ---- */
    :root {
      --safe-top: max(59px, env(safe-area-inset-top, 0px));
      --safe-bottom: max(34px, env(safe-area-inset-bottom, 0px));
    }

    /* ---- 根容器：满视口纵向弹性；宽屏限宽居中（平板 640 / 电脑 720，见文末 @media）---- */
    #app {
      display: flex; flex-direction: column;
      height: 100vh; height: 100dvh;
      margin: 0 auto; position: relative; overflow: hidden;
    }

    /* 全局隐藏滚动条（极简视觉：保留滚动能力，仅隐藏滚动条本身；浏览器端 `*` 合法） */
    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }

    /* ---- 视图层：JS 加 .on 显示（同一时刻只有一个视图可见，故不存在两层互透的重影问题）；
           转场类 nt-slide-in（前进自右滑入）/ nt-slide-in-back（返回自左滑回）由 theme.css 单一真源定义。
           内容错落入场由 .nt-cascade 门控，只在冷启动首屏那一页保留 —— 切页已有整层滑入承担位移，
           若内容再各自上浮一次，两种动效叠加会看成"重影"。 */
    .view { display: none; flex: 1; flex-direction: column; min-height: 0; }
    .view.on { display: flex; }

    /* 页面纵向布局容器、结果页答案分区、关于页设置区节奏 = 设计版式，统一走 theme.css（.home/.res/.ab/.dl、
       .ab-setlist、.res-lead-h/.res-block/.res-block-label，v3.1.0 起集中在 theme.css，此处不再各写一份）。 */

    /* ---- 滚动正文区：theme.css 给了 flex:1 / height:0 / 内边距；浏览器端补滚动能力 ---- */
    .nt-pgbody { overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* ---- 顶栏按钮是 <button>：清掉浏览器默认边框/背景，交互态交给 .nt-press ---- */
    .nt-nav-about, .nt-nav-back { background: none; border: none; cursor: pointer; font-family: inherit; color: var(--nt-ink); }
    .nt-nav-about { padding: 0 4px; }
    /* 导航按钮（「关于」/ 返回「‹」）拿 transform 做垂直居中，故只降透明度、不做缩放。
       ⚠️ 这里不能顺带把 .nt-pill-search / .nt-setrow 写进来 —— 会覆盖 theme.css 里含 transform 的
       transition，把它们的按压缩放一起掐掉。 */
    .nt-nav-about, .nt-nav-back { transition: opacity var(--d-press) var(--ease-standard); }

    /* ---- PWA 安装引导（非设计稿元素，自用）----
       反白字统一用 --nt-bg（不是 --nt-paper）：--nt-paper 现在是「纸面色」，浅色下是浅灰，
       压在黑底上会发闷；--nt-bg 是「底色」，天然是与 --nt-ink 对拉的那一端。
       按钮不画描边（同全站规则），改用半透明白底表达可点。 */
    #installbar { display: none; align-items: center; justify-content: space-between; margin: 0 16px 12px; padding: 12px 16px; background: var(--nt-ink); color: var(--nt-bg); border-radius: var(--r-md); }
    #installbar .t { font-size: var(--fs-sub); font-weight: var(--fw-mid); }
    #installbar .d { font-size: var(--fs-cap); opacity: .8; }
    #installbar button { border: none; background: rgba(255, 255, 255, .18); color: var(--nt-bg); padding: 6px 16px; border-radius: var(--r-pill); font-size: var(--fs-cap); cursor: pointer; font-family: inherit; }
    .nt-dark #installbar button { background: rgba(0, 0, 0, .12); }

    /* ---- 响应式（HIG）：字号永不随视口缩放，只收紧留白与限宽 ----
       ① < 360pt：留白与胶囊宽度由 theme.css 的 @media 收紧
       ② 360–767：完全按设计稿
       ③ 平板 768–1023：内容居中不超 640
       ④ 电脑 / 网页 ≥1024：内容居中不超 720 */
    #app { width: 100%; }
    @media screen and (min-width: 768px) { #app { max-width: var(--w-tablet); } }
    @media screen and (min-width: 1024px) { #app { max-width: var(--w-desktop); } }
  </style>
</head>
<body>
  <div id="app" class="nt-page-safe">
    <!-- ================= 开屏页（设计稿「开屏页」）=================
         冷启动品牌瞬间：整屏 flex 居中「品牌组(Logo 85.69×96 + 玄玖灵犀 28pt) + 副标 12pt 黑30%」，
         停留后退场（--d-splash）：品牌组缩放到起始页比例淡出（与起始页 Logo/名「交接」），
         背景与副标后段淡出。无导航、无返回、无页脚（与起始页不同，起始页没有副标）。
         视觉全在 theme.css（.nt-splash*）；文案来自 settings.js 的 about().splash；
         Logo 与首页同一份 themeLogo（随主题换 logo-white.png，由 app.js 的 applyTheme 填）。 -->
    <div class="nt-splash" id="splash">
      <div class="nt-splash-brand">
        <img class="nt-splash-logo" id="splashLogo" src="../../static/icons/logo.png" alt="" />
        <div class="nt-splash-name" id="splashName"></div>
      </div>
      <div class="nt-splash-sub" id="splashSub"></div>
    </div>

    <!-- ================= 首页（设计稿「起始页」）=================
         导航「关于」左上 + 空态块（Logo 64.27×72 → 玄玖灵犀 22pt → 搜索胶囊 272×48
         → 内容仅供交流学习 12pt，间距恒 16、整块垂直居中）+ 底部备案号·版权。
         注意：起始页没有「演乾坤 · 知天命」副标（以设计稿文档为准，其内嵌缩略图是旧版）。 -->
    <div class="view on nt-cascade" id="v-home">
      <div class="home">
        <div class="nt-nav">
          <button id="aboutbtn" class="nt-nav-about">关于</button>
        </div>
        <div class="nt-hero">
          <img id="heroLogo" class="nt-hero-logo" src="../../static/icons/logo.png" alt="玄玖灵犀" />
          <div class="nt-hero-title">玄玖灵犀</div>
          <div class="nt-hero-pill nt-pill" id="heroPill">
            <!-- 常驻强调光环：独立子节点（第一个孩子），只管呼吸，不参与点击与布局 -->
            <span class="nt-halo"></span>
            <input class="nt-pill-input" id="heroinput" />
            <!-- 滚动搜索建议（真实示例词条，内容来自 settings.js 的 searchHints 单一真源，由 app.js 渲染）。
                 结构：.nt-ph（裁切窗，48pt 高）> .nt-ph-track（整列）> N 个 .nt-ph-item。
                 轮换节奏（停留 5s → 上滑一行 0.5s，同百度首页）与分档 keyframe 全在 theme.css；
                 词条由 JS 填，末尾再补一份首词条实现无缝衔接；
                 输入非空或已聚焦时给 .nt-pill 加 .nt-ph-off 整体隐去。 -->
            <div class="nt-ph" id="heroPh"><div class="nt-ph-track" id="heroPhTrack"></div></div>
            <span class="nt-pill-search" id="heroSend"><span class="nt-icon nt-i-search"></span></span>
          </div>
          <div class="nt-hero-note" id="heroDisclaimer"></div>
        </div>
        <footer class="nt-foot">
          <span class="nt-setfoot-line" id="icp"></span>
          <span class="nt-setfoot-line" id="copy"></span>
        </footer>
      </div>
    </div>

    <!-- ================= 结果页（设计稿「搜索结果页」）=================
         顶栏标题「玄玖灵犀」+ 页名「搜索结果」+ 单张正文范围卡（高 = 剩余空间 → 528）
         + 底部双按钮「导出图片 / 再问一个」+ 页脚。 -->
    <div class="view" id="v-result">
      <div class="res">
        <div class="nt-nav">
          <button class="nt-nav-back" id="resultback"><span class="nt-icon nt-i-back"></span></button>
          <span class="nt-nav-title" id="restitle">玄玖灵犀</span>
        </div>
        <div class="nt-page-h" id="respageh">搜索结果</div>
        <div class="nt-pgbody">
          <div class="nt-dl-card">
            <span class="nt-dl-h1" id="resqlabel">你的提问</span>
            <span class="nt-dl-text nt-dl-text-light" id="resquestion"></span>
            <span class="nt-dl-h1 res-lead-h" id="reslead"></span>
            <div id="resblocks"></div>
          </div>
        </div>
        <div class="nt-dual">
          <!-- 双按钮文案走 settings.js 的 about.resultActions（单一真源，由 app.js 填充，不在此写死） -->
          <button class="nt-pill-btn ghost" id="exportbtn"></button>
          <button class="nt-pill-btn" id="againbtn"></button>
        </div>
        <footer class="nt-foot" id="res-foot"></footer>
      </div>
    </div>

    <!-- ================= 关于页（设计稿「关于页」）=================
         导航「关于」+ 品牌区（Logo / 玄玖灵犀 22pt / 演乾坤·知天命 12pt）
         + 4 张设置卡（第 4 张全红态）+ 页脚。 -->
    <div class="view" id="v-about">
      <div class="ab">
        <div class="nt-nav">
          <button class="nt-nav-back" id="aboutback"><span class="nt-icon nt-i-back"></span></button>
          <span class="nt-nav-title">关于</span>
        </div>
        <div class="nt-pgbody nt-pt">
          <div class="nt-brand">
            <img id="aboutLogo" class="nt-brand-logo" src="../../static/icons/logo.png" alt="玄玖灵犀" />
            <span class="nt-brand-name">玄玖灵犀</span>
            <span class="nt-brand-sub" id="ab-slogan"></span>
          </div>
          <div class="nt-setlist ab-setlist" id="ab-setlist"></div>
        </div>
        <footer class="nt-foot" id="ab-foot"></footer>
      </div>
    </div>

    <!-- ================= 关于我们页（设计稿「关于我们」）=================
         ⚠️ 设计稿此页**没有品牌区**：3 张卡直接从 y130 起（与关于页品牌区同一 y），别照抄关于页。 -->
    <div class="view" id="v-us">
      <div class="ab">
        <div class="nt-nav">
          <button class="nt-nav-back" id="usback"><span class="nt-icon nt-i-back"></span></button>
          <span class="nt-nav-title" id="us-title"></span>
        </div>
        <div class="nt-pgbody nt-pt">
          <div class="nt-setlist" id="us-setlist"></div>
        </div>
        <footer class="nt-foot" id="us-foot"></footer>
      </div>
    </div>

    <!-- ================= 内容详情页（一稿两用 5 个子页）=================
         顶栏标题 = 玄玖灵犀；页名 = 板块标题；正文范围卡（高 = 剩余空间 → 600）。 -->
    <div class="view" id="v-detail">
      <div class="dl">
        <div class="nt-nav">
          <button class="nt-nav-back" id="detailback"><span class="nt-icon nt-i-back"></span></button>
          <span class="nt-nav-title" id="detailnavtitle"></span>
        </div>
        <div class="nt-page-h" id="detailtitle"></div>
        <div class="nt-pgbody">
          <div class="nt-dl-card">
            <div id="detail-items"></div>
          </div>
        </div>
        <footer class="nt-foot" id="detail-foot"></footer>
      </div>
    </div>

    <!-- PWA 安装引导 -->
    <div id="installbar">
      <div>
        <div class="t">安装「玄玖灵犀」到桌面</div>
        <div class="d">可离线运行，安装为 APP</div>
      </div>
      <button id="installbtn">安装</button>
    </div>
  </div>

  <!-- 浏览器 PWA 形态：只引入本形态用到的模块（全局挂载 NT.*），忽略不相关文件
       · 需要：analyzer(引擎) + 其子模块(db/lunar/ganzhi/name-study/bazi/ganzhi-analysis/intent)
               env(离线/安装引导) storage(本地缓存)
               settings(关于/页脚数据：版权/简介/版本/备案——单一真源，不另写一份)
               conversation(共享问答行为，单轮) result-format(共享结果排版)
               safe-area(安全区) theme(黑白双主题)
               ExportModule(导出图片：export-image 版式 + qrcode 二维码库，与小程序同一份)
       · 不需要（忽略）：*.vue（uni-app 视图，PWA 是原生 DOM 壳不用）
       · 顺序：历法内核（CoreModule）先于引擎子模块（analyzer 浏览器分支依赖全局） -->
  <script src="../../modules/CoreModule/config.js"></script>
  <script src="../../modules/CoreModule/solarlunar.js"></script>
  <script src="../../modules/CoreModule/lunar.js"></script>
  <script src="../../modules/CoreModule/bazi.js"></script>
  <script src="../../modules/CoreModule/kangxi-strokes.js"></script>
  <script src="../../modules/CoreModule/name81.js"></script>
  <script src="../../modules/CoreModule/zodiac-rel.js"></script>
  <script src="../../modules/CoreModule/ganzhi.js"></script>
  <script src="../../modules/CoreModule/wuxing.js"></script>
  <script src="../../modules/CoreModule/suntime.js"></script>
  <script src="../../modules/CoreModule/shensha.js"></script>
  <script src="../../modules/CoreModule/feixing.js"></script>
  <script src="../../modules/CoreModule/numeral.js"></script>
  <script src="../../modules/CoreModule/numberstars.js"></script>
  <script src="../../modules/CoreModule/iching.js"></script>
  <script src="../../modules/CoreModule/bazhai.js"></script>
  <script src="../../modules/CoreModule/xiaoshu.js"></script>
  <!-- 紫微斗数：内嵌 iztro（构建期资产，运行时不联网，UMD 挂 window.iztro）+ ziwei 适配层 -->
  <script src="../../modules/CoreModule/vendor/iztro.min.js"></script>
  <script src="../../modules/CoreModule/ziwei.js"></script>
  <!-- 占星/七政四余：内嵌 astronomy-engine（MIT，JPL 级，UMD 挂 window.Astronomy）+ astro 适配层 -->
  <script src="../../modules/CoreModule/vendor/astronomy.js"></script>
  <script src="../../modules/CoreModule/astro.js"></script>
  <!-- 奇门遁甲 C14（时家转盘·拆补定局，纯自研权威规则，依赖 NT.core.lunar + NT.core.ganzhi，二者已在前引入）-->
  <script src="../../modules/CoreModule/qimen.js"></script>
  <script src="../../modules/AnalyzerModule/db.js"></script>
  <script src="../../modules/AnalyzerModule/lunar.js"></script>
  <script src="../../modules/AnalyzerModule/ganzhi.js"></script>
  <script src="../../modules/AnalyzerModule/name-study.js"></script>
  <script src="../../modules/AnalyzerModule/bazi.js"></script>
  <script src="../../modules/AnalyzerModule/ganzhi-analysis.js"></script>
  <script src="../../modules/AnalyzerModule/intent.js"></script>
  <script src="../../modules/features/registry.js"></script>
  <script src="../../modules/AnalyzerModule/analyzer.js"></script>
  <script src="../../modules/EnvModule/env.js"></script>
  <script src="../../modules/StorageModule/storage.js"></script>
  <script src="../../modules/SettingsModule/settings.js"></script>
  <script src="../../modules/HomeModule/conversation.js"></script>
  <script src="../../modules/HomeModule/result-format.js"></script>
  <script src="../../modules/UIModule/safe-area.js"></script>
  <script src="../../modules/UIModule/theme.js"></script>
  <script src="../../modules/UIModule/transition.js"></script>
  <!-- 导出图片（独立模块 ExportModule）：二维码库 qrcode.js（本地内嵌、构建期资产、运行时不联网）
       + 版式与绘制 export-image.js（三端同一份，壳里不重画） -->
  <script src="../../modules/ExportModule/qrcode.js"></script>
  <script src="../../modules/ExportModule/export-image.js"></script>
  <script src="app.js"></script>
</body>
</html>
